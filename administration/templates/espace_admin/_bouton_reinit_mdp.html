{% comment %} Usage : include avec cible=<User> retour=<url de la page> {% endcomment %}
<form method="post" action="{% url 'admin_transformatrice:admin_reinitialiser_mdp' cible.pk %}"
      data-confirm="Générer un mot de passe provisoire pour {{ cible.prenom }} {{ cible.nom }} ? Son mot de passe actuel ne fonctionnera plus.">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ retour }}">
  <button type="submit" class="inline-flex items-center gap-1.5 text-xs font-semibold rounded-lg px-3 py-2 whitespace-nowrap"
          style="color:#0B5D0B;background:#E8F3E3;border:1px solid #B7D9AE;"
          aria-label="Réinitialiser le mot de passe de {{ cible.prenom }} {{ cible.nom }}">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
    Mot de passe
  </button>
</form>
